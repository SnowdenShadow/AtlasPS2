# AtlasPS2 theme - Midnight
#
# Copy this folder to ATLAS/THEMES/ on a Memory Card or a USB stick, so
# the path reads mc0:/ATLAS/THEMES/Midnight/theme.ini, then pick it in
# Home > Theme. The folder's name is the name the menu shows.
#
# COLOURS
#   #RRGGBB, or #RRGGBBAA to set transparency. The '#' is optional.
#
#   Alpha is on the PlayStation 2's own scale, where 80 is fully opaque
#   and anything above it over-saturates rather than getting brighter.
#   A value over 80 is clamped down to it, so writing FF - which every
#   other system spells "opaque" - gives you an opaque colour, not a
#   blown-out white block.
#
# WHAT HAPPENS TO MISTAKES
#   A key that is not listed below is ignored, and a value that is not
#   a colour leaves that one colour at its built-in default. A theme
#   with a typo in it still loads, minus the line with the typo, and a
#   theme file that is missing entirely leaves the built-in theme
#   active. Nothing here can stop the console from starting.
#
#   You do not have to set all fifteen. Anything you leave out keeps
#   the built-in value.
#
# READ IT ON A TELEVISION BEFORE YOU KEEP IT
#   A CRT blooms thin light text on a dark ground and bleeds saturated
#   reds. Colours chosen on a computer monitor routinely turn out
#   unreadable across a room. Home > Theme applies a theme the moment
#   you highlight it, so you can see it before saving.

[colors]

# The background gradient, top to bottom. Keep the two close: a wide
# gap bands visibly on a console with no dithering to hide it.
bg_top         = #0A0D18
bg_bottom      = #10162A

# Panels behind rows, and the hairline between them.
panel          = #161C30
panel_selected = #263561
separator      = #2A3149

# Text. The gap between text and text_dim is what makes a secondary
# line read as secondary at three metres; closing it makes the whole
# screen read as one flat block.
text           = #EEF1F8
text_dim       = #8F98B4
text_on_accent = #070A14

# The accent, and its dimmer companion for inactive states.
accent         = #7C6BFF
accent_dim     = #453C8C

# States. Desaturated on purpose - a pure red bleeds into the pixels
# beside it on a CRT and the text sitting on it stops being legible.
warn           = #FFC15E
error          = #E87070
ok             = #6BD69A

# The header and footer bars.
bar            = #0C1020
bar_text       = #8F98B4

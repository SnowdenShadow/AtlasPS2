# AtlasPS2 0.1.0 - French translation
#
# Generated from the built-in tables by `make lang`. Edit it to
# change what appears on screen: put the file at
#     mc0:/ATLAS/LANG/fr.ini
# and it is read at start-up.
#
# A key you delete, leave blank, or misspell falls back to the
# built-in text, so a partly translated file is safe. UTF-8,
# and accented characters are fine.

